name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          HASH=$(git rev-parse --short HEAD)
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} "calculadora-de-riego-v${VERSION}-${HASH}.apk" \;

      - name: Get version
        id: meta
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          HASH=$(git rev-parse --short HEAD)
          echo "tag=v${VERSION}-${HASH}" >> $GITHUB_OUTPUT
          echo "name=v${VERSION} · ${HASH}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: calculadora-de-riego-*.apk
          generate_release_notes: true
